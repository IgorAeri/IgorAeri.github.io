<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игорь — моушн-дизайнер и видеомонтажёр</title>
<meta name="description" content="Портфолио Игоря: моушн-графика и видеомонтаж. Работы и контакты в одном месте.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1a1c; --text:#f4f4f5; --mute:#a1a1aa;
  --glass:rgba(255,255,255,.045); --stroke:rgba(255,255,255,.09);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#2a2a2e,var(--bg) 70%);color:var(--text);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #8aa0ff;outline-offset:3px}
.page{width:min(1040px,100% - 32px);margin:clamp(24px,7vw,96px) auto;display:grid;gap:14px}

.card{background:var(--glass);border:1px solid var(--stroke);border-radius:30px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* header */
.head{display:flex;align-items:center;gap:20px;padding:18px}
.ava{flex:none;width:96px;height:96px;border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.1);background:linear-gradient(135deg,#4a4de8,#9a6bff);display:grid;place-items:center;font:700 40px var(--font)}
.ava img,.ava video{width:100%;height:100%;object-fit:cover;display:block}
.ava.has-video{background:#000}
h1{font:700 clamp(32px,6vw,56px)/1.05 var(--font);letter-spacing:-.025em}
.head p{margin-top:6px;color:var(--mute);font-size:clamp(15px,2vw,18px)}

/* groups */
.group{padding:14px}
.gh{display:flex;align-items:center;gap:12px;padding:2px 4px 14px}
.gi{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);display:grid;place-items:center}
.gi svg{width:16px;height:16px}
.gh h2{font:600 17px var(--font)}
.count{margin-left:auto;min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);display:grid;place-items:center;font-size:14px;color:var(--mute)}
.minis{display:grid;gap:12px}
.works{grid-template-columns:repeat(3,1fr)}
.services{grid-template-columns:repeat(3,1fr)}

.mini{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:22px;border:1px solid var(--stroke);background:linear-gradient(135deg,rgba(var(--rgb),.30),rgba(var(--rgb),.06));transition:transform .25s,border-color .25s}
a.mini:hover,a.mini:focus-visible{transform:translateY(-3px);border-color:rgba(255,255,255,.22)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,rgba(var(--rgb),.55),rgba(var(--rgb),.12))}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .play{position:absolute;left:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.thumb .play::after{content:"";margin-left:3px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.pill{padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--stroke);font-size:13px;color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.arr{width:14px;height:14px;flex:none;color:rgb(var(--rgb));filter:brightness(1.8)}
.t{font:600 17px/1.25 var(--font)}
.s{color:var(--mute);font-size:14px}
.service .t{margin-top:2px}
.service .s{font-size:15px}

/* big link cards */
.bigs{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:14px}
.big{position:relative;display:flex;flex-direction:column;gap:2px;min-height:170px;padding:16px 18px;border-radius:30px;border:1px solid var(--stroke);background:linear-gradient(135deg,rgba(var(--rgb),.34),rgba(var(--rgb),.07) 80%);transition:transform .25s,border-color .25s;overflow:hidden}
.big:hover,.big:focus-visible{transform:translateY(-3px);border-color:rgba(255,255,255,.22)}
.big .top{margin:0 0 14px}
.ib{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);display:grid;place-items:center;font:700 14px var(--font)}
.ib svg{width:20px;height:20px}
.big .pill{max-width:60%}
.big .t{font:700 clamp(22px,3vw,30px)/1.1 var(--font);letter-spacing:-.015em}
.big .d{color:#d4d4d8;opacity:.8}
.big .u{margin-top:auto;padding-top:10px;color:#e4e4e7;opacity:.85;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px}
.big .arr{position:absolute;right:18px;bottom:18px}

footer{text-align:center;color:var(--mute);font-size:14px;padding:6px 0 0}

/* one entrance moment */
.card,.big{animation:in .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .works,.services{grid-template-columns:1fr 1fr}
  .bigs{grid-template-columns:1fr 1fr}
  .bigs .big:nth-child(2){grid-column:span 2;order:-1}
}
@media (max-width:560px){
  .head{gap:14px}
  .ava{width:72px;height:72px;font-size:30px;border-radius:20px}
  .works,.services,.bigs{grid-template-columns:1fr}
  .bigs .big:nth-child(2){grid-column:auto;order:0}
}
@media (prefers-reduced-motion:reduce){
  .card,.big{animation:none}
  .mini,.big{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <header class="card head" style="--i:0">
    <div class="ava" id="ava"></div>
    <div>
      <h1 id="name"></h1>
      <p id="tag"></p>
    </div>
  </header>

  <section class="card group" style="--i:1" aria-labelledby="works-h">
    <div class="gh">
      <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg></span>
      <h2 id="works-h">Работы</h2>
      <span class="count" id="wc"></span>
    </div>
    <div class="minis works" id="works"></div>
  </section>

  <section class="card group" style="--i:2" aria-labelledby="serv-h">
    <div class="gh">
      <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>
      <h2 id="serv-h">Услуги</h2>
      <span class="count" id="sc"></span>
    </div>
    <div class="minis services" id="services"></div>
  </section>

  <nav class="bigs" id="links" aria-label="Контакты"></nav>

  <footer>© <span id="foot"></span></footer>
</main>

  { tag: "Монтаж", title: "Название проекта 6", where: "VK Видео",  year: 2025, link: "#", preview: "" }
];

const SERVICES = [
  { tag: "Анимация", title: "Моушн-графика", text: "Заставки, логотипы, инфографика, анимированные вставки." },
  { tag: "Видео",    title: "Видеомонтаж",   text: "Ролики, рилсы и шортсы, интервью, цвет и звук." },
  { tag: "Всё сразу", title: "Видео под ключ", text: "Монтаж и графика в одном проекте, единый стиль." }
];

/* Большие карточки внизу. icon: tg | yt | vk | mail. rgb - цвет подсветки */
const LINKS = [
  { icon: "tg",  title: "Telegram", desc: "Написать по заказу",  handle: "@ваш_ник",  show: "t.me/ваш_ник",         url: "https://t.me/ваш_ник",           rgb: "42,171,238" },
  { icon: "yt",  title: "YouTube",  desc: "Мой YouTube канал",   handle: "@ваш_канал", show: "youtube.com/@ваш_канал", url: "https://youtube.com/@ваш_канал", rgb: "239,68,68" },
  { icon: "vk",  title: "VK Видео", desc: "Работы во ВКонтакте", handle: "vk.com/ваш_ник", show: "vk.com/ваш_ник",   url: "https://vk.com/ваш_ник",         rgb: "70,110,230" }
];
/* ===================================== */

const ICONS = {
  tg:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 4 3 11l5 2 2 6 3-4 5 4z"/></svg>',
  yt:  '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9l5 3-5 3z" fill="#1a1a1c"/></svg>',
  vk:  'VK',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg>'
};
const ARROW = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const TINTS = ["52,160,130", "90,100,220"];
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* шапка */
$("name").textContent = CONFIG.name;
$("tag").textContent = CONFIG.tagline;
$("foot").textContent = CONFIG.brand;
const ava = $("ava");
const letter = () => { ava.classList.remove("has-video"); ava.textContent = CONFIG.name.trim().charAt(0).toUpperCase(); };
if (CONFIG.logo) {
  ava.classList.add("has-video");
  const v = document.createElement("video");
  v.src = CONFIG.logo;
  v.muted = true; v.loop = true; v.playsInline = true;
  v.setAttribute("aria-label", "Логотип " + CONFIG.name);
  v.preload = "auto";
  if (!reduce) v.autoplay = true;
  v.addEventListener("error", letter);
  ava.appendChild(v);
  if (!reduce) v.play().catch(() => {});
} else if (CONFIG.avatar) {
  ava.innerHTML = '<img alt="" src="' + CONFIG.avatar + '">';
} else {
  letter();
}

function el(tag, cls, html, rgb) {
  const e = document.createElement(tag);
  e.className = cls;
  if (html) e.innerHTML = html;
  if (rgb) e.style.setProperty("--rgb", rgb);
  return e;
}
function setText(node, sel, text) { node.querySelector(sel).textContent = text; }

/* работы */
$("wc").textContent = PROJECTS.length;
PROJECTS.forEach((p, i) => {
  const a = el("a", "mini work",
    '<div class="thumb">' + (p.preview ? '<video muted loop playsinline preload="metadata" src="' + p.preview + '"></video>' : "") + '<span class="play"></span></div>' +
    '<div class="top"><span class="pill"></span>' + ARROW + '</div><div class="t"></div><div class="s"></div>',
    TINTS[i % 2]);
  a.href = p.link;
  if (p.link && p.link !== "#") { a.target = "_blank"; a.rel = "noopener"; }
  setText(a, ".pill", p.tag);
  setText(a, ".t", p.title);
  setText(a, ".s", p.where + ", " + p.year);
  const v = a.querySelector("video");
  if (v && !reduce) {
    const start = () => v.play().catch(() => {});
    const stop = () => { v.pause(); v.currentTime = 0; };
    a.addEventListener("mouseenter", start); a.addEventListener("focus", start);
    a.addEventListener("mouseleave", stop);  a.addEventListener("blur", stop);
  }
  $("works").appendChild(a);
});

/* услуги */
$("sc").textContent = SERVICES.length;
SERVICES.forEach((s, i) => {
  const d = el("div", "mini service", '<div class="top"><span class="pill"></span></div><div class="t"></div><div class="s"></div>', TINTS[(i + 1) % 2]);
  setText(d, ".pill", s.tag);
  setText(d, ".t", s.title);
  setText(d, ".s", s.text);
  $("services").appendChild(d);
});

/* большие ссылки */
LINKS.forEach((l, i) => {
  const a = el("a", "big",
    '<div class="top"><span class="ib">' + ICONS[l.icon] + '</span><span class="pill"></span></div><div class="t"></div><div class="d"></div><div class="u"></div>' + ARROW,
    l.rgb);
  a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.style.setProperty("--i", i + 3);
  setText(a, ".pill", l.handle);
  setText(a, ".t", l.title);
  setText(a, ".d", l.desc);
  setText(a, ".u", l.show);
  $("links").appendChild(a);
});
</script>
</body>
</html>
